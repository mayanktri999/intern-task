<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRONZONE - Shopping Cart</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/cart.css">
</head>
<body>
    <!-- Header Component -->
    <header class="header">
        <div class="header__container">
            <button class="header__menu-btn" id="menuBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <h1 class="header__logo">IRONZONE</h1>
            
            <!-- Desktop Navigation Menu -->
            <nav class="desktop-menu">
                <a class="desktop-menu__item" href="index.html">HOME</a>
                <a class="desktop-menu__item" href="category.html">CATEGORIES</a>
                <a class="desktop-menu__item" href="profile.html">PROFILE</a>
            </nav>

            <button class="header__cart-btn" id="cartBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Mobile Menu -->
    <div class="mobile-menu__overlay" id="menuOverlay"></div>
    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu__items">
            <a class="mobile-menu__item" href="index.html">
                <div class="mobile-menu__icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
                    </svg>
                </div>
                <span>HOME</span>
            </a>
            <a class="mobile-menu__item" href="category.html">
                <div class="mobile-menu__icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 3h8v8H3V3m10 0h8v8h-8V3M3 13h8v8H3v-8m10 0h8v8h-8v-8z"></path>
                    </svg>
                </div>
                <span>CATEGORIES</span>
            </a>
            <a class="mobile-menu__item" href="profile.html">
                <div class="mobile-menu__icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
                    </svg>
                </div>
                <span>PROFILE</span>
            </a>
            <a class="mobile-menu__item" href="cart.html">
                <div class="mobile-menu__icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </div>
                <span>CART</span>
            </a>
        </div>
    </div>

    <!-- Cart Page -->
    <main class="cart-page">
        <div class="cart-header">
            <h1>SHOPPING CART</h1>
        </div>

        <div class="cart-container">
            <!-- Cart Items -->
            <section class="cart-items" id="cartItems">
                <div class="empty-cart" id="emptyCart">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <h2>Your cart is empty</h2>
                    <p>Add items to get started</p>
                    <a href="category.html" class="btn-continue-shopping">Continue Shopping</a>
                </div>
            </section>

            <!-- Cart Summary -->
            <aside class="cart-summary">
                <div class="summary-card">
                    <h2>Order Summary</h2>
                    
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">₹0</span>
                    </div>
                    
                    <div class="summary-row">
                        <span>Discount:</span>
                        <span id="discount" style="color: var(--color-primary);">-₹0</span>
                    </div>
                    
                    <div class="summary-row">
                        <span>Shipping:</span>
                        <span id="shipping">FREE</span>
                    </div>
                    
                    <div class="summary-row divider">
                        <span>Total:</span>
                        <span id="total" style="font-size: var(--font-size-2xl); font-weight: 900;">₹0</span>
                    </div>
                    
                    <button class="btn-checkout" id="checkoutBtn">PROCEED TO CHECKOUT</button>
                    <a href="category.html" class="btn-continue">Continue Shopping</a>
                </div>
            </aside>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
